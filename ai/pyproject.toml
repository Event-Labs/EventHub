[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub-ai"
version = "0.1.0"
description = "EventHub AI Training Pipeline for fine-tuning Qwen3 using LoRA"
authors = [
    { name="EventHub AI Team", email="ai@eventhub.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.2",
    "transformers>=4.38.2",
    "peft>=0.9.0",
    "trl>=0.7.11",
    "datasets>=2.17.1",
    "accelerate>=0.27.2",
    "bitsandbytes>=0.42.0",
    "scipy>=1.12.0",
    "tqdm>=4.66.2",
    "safetensors>=0.4.2",
    "sentencepiece>=0.2.0",
    "torchao>=0.16.0"
]

[project.scripts]
build-dataset = "scripts.build_dataset:main"
train-model = "scripts.train_model:main"
