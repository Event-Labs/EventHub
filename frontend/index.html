<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/webp" href="/src/assets/eventhub-mark.webp" />
    <!-- Preload critical branding and LCP images before DOM tree construction -->
    <link rel="preload" as="image" href="/src/assets/eventhub-mark.webp" type="image/webp" />
    <link rel="preload" as="image" href="/src/assets/eventhub-logo.webp" type="image/webp" />
    <link rel="preload" as="image" href="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/130837c4-0244-4f37-9c61-8d801d93fd29.jpg" />

    <!-- Prefetch static background assets for instant rendering -->
    <link rel="prefetch" as="image" href="/space-stars-bg.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="/space-portal-bg.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="/images/starry-bg.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <title>EventHub - Event Operations And Management Platform</title>
    <script>
      const isPortalRoute = /^\/(admin|organizer|staff)(\/|$)/.test(window.location.pathname);
      const getStoredUser = () => {
        const rawUser = localStorage.getItem('eventhub-user') || sessionStorage.getItem('eventhub-user');
        if (!rawUser) return null;
        try {
          return JSON.parse(rawUser);
        } catch {
          return null;
        }
      };

      const user = getStoredUser();
      const accountKey = user?.id || user?.user_id || user?._id || user?.email;
      const theme = (isPortalRoute && accountKey) ? localStorage.getItem(`eventhub-theme:${String(accountKey).toLowerCase()}`) : 'dark';
      document.documentElement.classList.toggle('light', theme === 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
